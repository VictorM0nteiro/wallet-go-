services:
  postgres:
    image: postgres:16
    # Tuned for this host (12 threads, ~15 GiB), not for a production server:
    # shared_buffers and effective_cache_size use headroom the stock 128MB/4GB
    # defaults left idle; max_wal_size spaces out checkpoints during load-test
    # bursts; random_page_cost assumes SSD instead of the default spinning-disk
    # value. Durability settings (fsync, synchronous_commit) are untouched.
    # See docs/bench/RESULTS.md for the measurements taken under this config.
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=2GB"
      - "-c"
      - "effective_cache_size=10GB"
      - "-c"
      - "max_wal_size=4GB"
      - "-c"
      - "random_page_cost=1.1"
    environment:
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
      POSTGRES_DB: wallet
    ports:
      - "5432:5432"
    volumes:
      - wallet_pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d wallet"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: migrate/migrate:v4.18.1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations
    command:
      ["-path", "/migrations", "-database", "postgres://wallet:wallet@postgres:5432/wallet?sslmode=disable", "up"]
    restart: "no"

  app:
    build: .
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      WALLET_TRANSFER_STRATEGY: ${WALLET_TRANSFER_STRATEGY:-locking}
      WALLET_DB_MAX_CONNS: ${WALLET_DB_MAX_CONNS:-30}
      # wallet_app is the least-privilege role from migration 000002 (X8):
      # no UPDATE/DELETE on entries, UPDATE only on idempotency_keys' state
      # columns. migrate above still runs as wallet, the schema owner.
      DATABASE_URL: postgres://wallet_app:wallet_app_dev@postgres:5432/wallet?sslmode=disable
      WALLET_API_KEY: dev-key
      LISTEN_ADDR: :8080
    ports:
      - "8080:8080"

volumes:
  wallet_pgdata: